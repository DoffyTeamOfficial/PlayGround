<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Cove</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c18;font-family:'Courier New',monospace;image-rendering:pixelated}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}#ui{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;background:#18233b;border:4px solid #080b15;box-shadow:0 0 0 3px #59678a,inset 0 0 0 2px #344461;color:#fff}.top{position:absolute;left:18px;top:14px;display:flex;gap:8px}.stat{height:54px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:bold}.portrait{width:38px;height:38px;background:#6d4c3d;border:3px solid #080b15;position:relative}.portrait:before{content:'';position:absolute;width:18px;height:20px;background:#d99e70;left:7px;top:7px}.portrait:after{content:'';position:absolute;width:24px;height:8px;background:#9f3f32;left:4px;top:-2px}.bar{width:88px;height:9px;background:#090d18;border:2px solid #090d18}.fill{height:100%;background:#61c44b}.coin{color:#ffe65a}.quest{position:absolute;right:18px;top:14px;width:236px;padding:12px;font-size:12px}.quest b{display:block;color:#ffe65a;margin-bottom:7px}.quest .qline{color:#b8c8d9}.bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}.slot{width:66px;height:66px;display:flex;align-items:center;justify-content:center;position:relative;font-size:30px}.slot.selected{border-color:#ffe65a;box-shadow:0 0 0 3px #c58a29}.slot small{position:absolute;bottom:-17px;font-size:11px;color:#fff;text-shadow:2px 2px #000}.toast{position:absolute;left:50%;top:74px;transform:translateX(-50%);padding:9px 14px;font-size:13px;opacity:0;transition:.25s}.toast.show{opacity:1}.shop{position:absolute;right:18px;top:230px;width:260px;padding:14px;display:none}.shop.open{display:block}.shop h3{margin:0 0 10px;color:#ffe65a}.item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px}.buy{pointer-events:auto;border:3px solid #080b15;background:#5c9e52;color:white;padding:7px;font-family:inherit;cursor:pointer}.controls{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:42px 42px 42px;gap:4px}.controls button{pointer-events:auto;width:42px;height:42px;border:3px solid #080b15;background:#dfe5b4;color:#18233b;font-size:18px;font-weight:bold}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}@media(max-width:700px){.quest{display:none}.top{left:8px;top:8px}.stat{height:46px;padding:5px}.portrait{width:32px;height:32px}.bar{width:52px}.slot{width:54px;height:54px}.bottom{bottom:8px}.controls{display:none}}
</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="panel stat"><div class="portrait"></div><div><div>Fisher</div><div class="bar"><div id="hp" class="fill"></div></div></div></div><div class="panel stat"><span class="coin">◆</span><span id="coins">120</span></div></div><div class="panel quest"><b>DAILY QUEST</b><div class="qline" id="quest">Catch 5 fish</div><div class="qline" id="questprog">0 / 5 caught</div></div><div id="toast" class="panel toast">Cast near the ripples</div><div class="panel shop" id="shop"><h3>Dock Shop</h3><div class="item"><span>Wooden Rod</span><button class="buy" data-price="0">OWNED</button></div><div class="item"><span>Silver Rod</span><button class="buy" data-price="250">250◆</button></div><div class="item"><span>Golden Lure</span><button class="buy" data-price="150">150◆</button></div></div><div class="bottom"><div class="slot selected"><span>🎣</span><small>FISHING</small></div><div class="slot"><span>🪱</span><small>x12</small></div><div class="slot"><span>🐟</span><small id="bag">0</small></div></div><div class="controls"><button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const world={w:2400,h:1600};let cam={x:0,y:0};const player={x:1200,y:760,dir:2,step:0,casting:false,reeling:false};const keys={};let coins=120,caught=0,bag=0,rod='Wooden',lure=false,fish=[];
const ripples=[{x:790,y:870},{x:940,y:1090},{x:1550,y:930},{x:1720,y:1160},{x:1300,y:1310},{x:610,y:1220},{x:2010,y:790}];
for(let i=0;i<80;i++)fish.push({x:260+Math.random()*(world.w-520),y:870+Math.random()*520,dx:(Math.random()-.5)*.35,vy:0});
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function pixelText(t,x,y,s=16,c='#fff'){ctx.font=`bold ${s}px monospace`;ctx.fillStyle='#080b15';ctx.fillText(t,x+2,y+2);ctx.fillStyle=c;ctx.fillText(t,x,y)}
function inWater(x,y){return y>820}
function draw(){ctx.clearRect(0,0,W,H);cam.x=Math.max(0,Math.min(world.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,player.y-H/2));ctx.save();ctx.translate(-cam.x,-cam.y);
// grass terrain
rect(0,0,world.w,world.h,'#69a85f');for(let x=0;x<world.w;x+=64)for(let y=0;y<world.h;y+=64){if((x/64+y/64)%3===0)rect(x+18,y+20,4,4,'#5b9852');if((x*7+y*3)%11===0)rect(x+44,y+38,12,5,'#568c4b')}
// river/shore
ctx.beginPath();ctx.moveTo(0,820);ctx.bezierCurveTo(500,770,700,890,1050,830);ctx.bezierCurveTo(1500,760,1900,880,2400,810);ctx.lineTo(2400,1600);ctx.lineTo(0,1600);ctx.closePath();ctx.fillStyle='#58a8bd';ctx.fill();for(let i=0;i<20;i++)rect(i*140+((performance.now()/40+i*31)%140),850+(i%4)*160,70,4,'#79c9cf');
// dock
rect(1080,760,420,70,'#5a3d2c');rect(1080,760,420,10,'#805a3c');for(let x=1090;x<1490;x+=55)rect(x,770,8,55,'#3d2a22');for(let x=1120;x<1490;x+=120)rect(x,820,30,55,'#4a3428');
// shop building
rect(1700,400,280,210,'#8e5d3e');rect(1688,390,304,32,'#b64d3d');rect(1730,430,220,180,'#b58a58');rect(1750,500,70,110,'#6d4937');rect(1870,485,62,62,'#84c0c7');rect(1878,493,46,46,'#c4edf0');pixelText('TACKLE',1822,470,18,'#ffe786');
// trees
for(const [x,y]of[[180,520],[250,620],[330,470],[420,650],[610,430],[760,550],[1830,250],[1960,300],[2100,500],[2200,340],[560,130],[900,300]]){rect(x+20,y+46,18,48,'#6d4934');rect(x-18,y-14,74,72,'#2f7645');rect(x+0,y-34,58,54,'#3d9252');rect(x+5,y-2,30,20,'#54a05a')}
// rocks and flowers
for(let i=0;i<40;i++){const x=(i*173)%2200,y=(i*97)%760;if(!inWater(x,y)){rect(x,y,15,10,i%2?'#6f7f78':'#87978d')}}
// ripples
ripples.forEach((r,i)=>{ctx.strokeStyle='rgba(220,245,238,.8)';ctx.lineWidth=3;const n=(performance.now()/700+i)%1;ctx.beginPath();ctx.ellipse(r.x,r.y,15+n*16,5+n*5,0,0,Math.PI*2);ctx.stroke()});
// fish underwater
fish.forEach(f=>{f.x+=f.dx;if(f.x<350||f.x>2200)f.dx=-f.dx;rect(f.x,f.y,18,8,f.x%2?'#d49b55':'#dfbc69');rect(f.x-6,f.y+2,7,5,'#d49b55')});
// player
const px=player.x,py=player.y;rect(px-14,py+22,28,10,'#2e3040');rect(px-12,py-18,24,38,'#d45549');rect(px-10,py-30,20,18,'#e2af75');rect(px-12,py-34,24,8,'#2c3a57');rect(px-9,py-12,18,6,'#f5e1a8');rect(px-8,py+8,8,18,'#3b4d70');rect(px+2,py+8,8,18,'#3b4d70');
if(player.casting){ctx.strokeStyle='#d6e9a6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+12,py-10);ctx.lineTo(px+45,py-55);ctx.lineTo(px+100,py-32);ctx.stroke();rect(px+98,py-34,5,5,'#fff')}
ctx.restore();}
function update(){const sp=keys.Shift?4.5:3.1;let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx=-sp;if(keys.ArrowRight||keys.d)dx=sp;if(keys.ArrowUp||keys.w)dy=-sp;if(keys.ArrowDown||keys.s)dy=sp;if(dx||dy){player.step+=.2;player.x=Math.max(35,Math.min(world.w-35,player.x+dx));player.y=Math.max(35,Math.min(world.h-35,player.y+dy));if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?1:3;else player.dir=dy>0?2:0}}
let casting=false,catchTimer=0,activeRipple=null;function cast(){if(casting)return;const near=ripples.find(r=>Math.hypot(r.x-player.x,r.y-player.y)<150);if(!near){showToast('Cast near the water ripples');return}if(!inWater(player.y)&&Math.hypot(near.x-player.x,near.y-player.y)<230){showToast('Stand closer to the water');return}casting=true;activeRipple=near;player.casting=true;showToast('Fishing... press SPACE when the line bites!');catchTimer=setTimeout(()=>{if(casting&&activeRipple===near){showToast('BITE! Press SPACE');catchTimer=setTimeout(()=>{if(casting)cancelCast()},2200)}},1800+Math.random()*2400)}
function cancelCast(){casting=false;player.casting=false;catchTimer&&clearTimeout(catchTimer)}
function catchFish(){if(!casting)return;coins+=10+Math.floor(Math.random()*20);bag++;caught++;document.getElementById('coins').textContent=coins;document.getElementById('bag').textContent=bag;document.getElementById('questprog').textContent=caught+' / 5 caught';showToast(['Caught a Bluegill!','Caught a Golden Minnow!','Caught a River Bass!'][Math.floor(Math.random()*3)]+'  +coins');cancelCast();if(caught>=5&&caught<6)showToast('Quest complete!  +50 bonus');if(caught===5)coins+=50}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.remove('show'),1800)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();if(casting)catchFish();else cast()}if(e.key==='e'||e.key==='E')toggleShop()});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addPointerCapture?.(0);b.addEventListener('pointerdown',()=>keys[k]=true);b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)});
function toggleShop(){const s=document.getElementById('shop');const open=!s.classList.contains('open');s.classList.toggle('open',open&&Math.hypot(player.x-1850,player.y-610)<260)}document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{const p=+b.dataset.price;if(p===0)return;if(coins>=p){coins-=p;b.textContent='OWNED';document.getElementById('coins').textContent=coins;showToast('Purchase complete')}else showToast('Not enough coins')});
canvas.addPointerCapture?.(0);canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){const r=canvas.getBoundingClientRect(),tx=e.clientX-r.left,ty=e.clientY-r.top;if(tx>W*.65&&ty>H*.72){cast()}else{const dx=tx-W/2,dy=ty-H/2;player.x+=dx*.03;player.y+=dy*.03}}else cast()});
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
